name: Capture2Cloud CI/CD — Linux and native clients

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Capture2Cloud build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file xvfb xauth zip unzip git nasm nodejs python3 gstreamer1.0-tools \
            libsdl2-dev libpulse-dev libjpeg-dev libgtk-3-dev libx11-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-nice \
            libavcodec-dev libavutil-dev libswscale-dev libusb-1.0-0-dev \
            libglib2.0-dev libjson-glib-dev libbluetooth-dev libssl-dev \
            adwaita-icon-theme librsvg2-common libgdk-pixbuf2.0-bin
      - name: Verify required runtime plugins and localization
        run: |
          gst-inspect-1.0 x264enc >/dev/null
          gst-inspect-1.0 vp8enc >/dev/null
          gst-inspect-1.0 opusenc >/dev/null
          python3 tools/check-wozt-assets.py
          python3 tools/check-wozt-tooltips.py
          python3 tools/check-wozt-translations.py --strict
      - name: Build server and PCBLE backends
        shell: bash
        run: |
          source scripts/lib_toggle.sh
          c2c_build_if_needed
      - name: Run C regression suite (including GTK layout)
        shell: bash
        run: ./tests/run_all.sh
      - name: Package historical Linux ZIP
        shell: bash
        run: bash tools/package-linux-zip.sh
      - name: Build AppImage and verify extracted resources
        shell: bash
        run: ./tools/build-appimage.sh
      - name: Confirm packaged GTK symbolic icons render
        shell: bash
        run: |
          gcc -O2 -Wall -Wextra -o dist/check-gtk-icons \
            tools/check-gtk-icons.c $(pkg-config --cflags --libs gtk+-3.0)
          xvfb-run -a env XDG_DATA_DIRS="$PWD/dist/squashfs-root/usr/share" \
            GTK_DATA_PREFIX="$PWD/dist/squashfs-root/usr" \
            dist/check-gtk-icons
      - name: Upload Linux ZIP, AppImage and checksum
        uses: actions/upload-artifact@v7
        with:
          name: capture2cloud-linux
          path: |
            dist/capture2cloud-linux-x86_64.zip
            dist/capture2cloud-x86_64.AppImage
            dist/capture2cloud-x86_64.AppImage.sha256
          if-no-files-found: error

  client-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 using runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$(command -v sdkmanager || true)"
          if [[ -z "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          fi
          test -x "$manager"
          export ANDROID_HOME="$sdk"
          export ANDROID_SDK_ROOT="$sdk"
          # Avoid pipefail treating yes's expected SIGPIPE as a failure.
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/aapt2"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$sdk/platform-tools" "$sdk/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build Android (signed when release secrets are configured)
        shell: bash
        env:
          C2C_ANDROID_KEYSTORE_B64: ${{ secrets.C2C_ANDROID_KEYSTORE_B64 }}
          C2C_ANDROID_PASSWORD: ${{ secrets.C2C_ANDROID_PASSWORD }}
        run: |
          if [[ -n "$C2C_ANDROID_KEYSTORE_B64" && -n "$C2C_ANDROID_PASSWORD" ]]; then
            umask 077
            mkdir -p "$HOME/.android/capture2cloud-signing"
            printf '%s' "$C2C_ANDROID_KEYSTORE_B64" | base64 -d \
              > "$HOME/.android/capture2cloud-signing/release.jks"
            printf '%s' "$C2C_ANDROID_PASSWORD" \
              > "$HOME/.android/capture2cloud-signing/password"
          fi
          bash tools/build-release-client.sh android
      - uses: actions/upload-artifact@v7
        with:
          name: capture2cloud-android
          path: dist/client-artifacts/*.apk
          if-no-files-found: error

  clients-nintendo:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: switch
            image: devkitpro/devkita64:latest
            packages: switch-dev switch-sdl2 switch-sdl2_ttf switch-ffmpeg switch-libopus switch-libvpx switch-libogg
            asset: capture2cloud-switch.zip
          - platform: wiiu-console
            image: devkitpro/devkitppc:latest
            packages: wiiu-dev wiiu-sdl2 wiiu-sdl2_ttf ppc-brotli
            asset: capture2cloud-wiiu-console.zip
          - platform: old3ds
            image: devkitpro/devkitarm:latest
            packages: 3ds-dev 3ds-libjpeg-turbo 3ds-libopus
            asset: capture2cloud-old3ds.zip
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install matching devkitPro portlibs and host packaging tools
        shell: bash
        env:
          PORTLIB_PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential python3 git curl zip unzip ca-certificates file \
            pkg-config automake autoconf libtool cmake
          # Official devkitPro images already include many required portlibs.
          # Avoid refreshing repositories when all dependencies are installed.
          read -r -a required <<< "$PORTLIB_PACKAGES"
          if ! dkp-pacman -Q "${required[@]}" >/dev/null 2>&1; then
            installed=0
            for delay in 0 10 30 60; do
              sleep "$delay"
              if dkp-pacman -Syu --needed --noconfirm "${required[@]}"; then
                installed=1
                break
              fi
            done
            [[ "$installed" == 1 ]] || exit 1
          fi
          dkp-pacman -Q "${required[@]}"
      - name: Build and package fresh ${{ matrix.platform }} client
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
        run: bash tools/build-release-client.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v7
        with:
          name: capture2cloud-${{ matrix.platform }}
          path: dist/client-artifacts/${{ matrix.asset }}
          if-no-files-found: error

  client-wiiu-gamepad:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install PC GamePad transport build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git zip binutils file \
            libavcodec-dev libavutil-dev libswscale-dev libopus-dev libcairo2-dev
      - name: Build GamePad host client from source, using pinned libdrc/x264 vendor
        shell: bash
        run: bash tools/build-release-client.sh wiiu-gamepad
      - uses: actions/upload-artifact@v7
        with:
          name: capture2cloud-wiiu-gamepad
          path: dist/client-artifacts/capture2cloud-wiiu-gamepad.zip
          if-no-files-found: error

  release:
    needs: [build, client-android, clients-nintendo, client-wiiu-gamepad]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: capture2cloud-versioned-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: capture2cloud-*
          path: dist
          merge-multiple: true
      - name: Validate every expected release asset, generate global SHA256SUMS
        shell: bash
        run: |
          python3 tools/check-release-assets.py dist > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Pick immutable four-part version from remote tags
        id: version
        shell: bash
        run: |
          git fetch --tags origin
          python3 tools/next-release-version.py > "$RUNNER_TEMP/release-version.env"
          cat "$RUNNER_TEMP/release-version.env" >> "$GITHUB_OUTPUT"
      - name: Publish full multi-client release (never overwrite tags)
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.zip dist/*.apk dist/*.sha256 dist/SHA256SUMS)
          [[ ${#files[@]} -ge 8 ]] || { echo 'Incomplete release asset set' >&2; exit 1; }
          notes="Automatic CI build for commit $GITHUB_SHA. Includes Linux AppImage and ZIP, Android APK, Switch, Wii U console, Wii U GamePad (PC host) and Old 3DS/2DS. See SHA256SUMS. Android debug-signed builds are named *-debug.apk and are not upgrade-compatible with release-signed APKs. The release tag increments independently of in-app VERSION."
          gh release create "$NEXT_TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Capture2Cloud $NEXT_TAG" \
            --notes "$notes"
