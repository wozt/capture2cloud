<title>Capture2Cloud</title>
<!-- Without this, mobile browsers lay the page out in a virtual ~980px
     viewport and scale the result down: on a phone the touch overlay
     was sized for a viewport wider and taller than the actual screen,
     so its bottom row (triggers, sticks, Home) fell outside the visible
     area. `user-scalable=no` because a pinch-zoom in the middle of a
     game is never intentional, and `viewport-fit=cover` so the video
     fills notched screens -- the overlay keeps clear of the notch via
     the safe-area padding on #vgp below. -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="/web/styles/app.css">
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c" style="display:none"></canvas>
<div id="gate"><button id="gate-btn">start stream</button></div>
<div id="vgp" class="hidden">
  <div class="vgp-stick vgp-anchor" id="vgp-lstick"><div class="vgp-knob"></div></div>
  <div class="vgp-stick vgp-anchor" id="vgp-rstick"><div class="vgp-knob"></div></div>
  <div class="vgp-dpad vgp-anchor" id="vgp-dpad">
    <div class="vgp-dpad-arrow vgp-dpad-up">&#9650;</div>
    <div class="vgp-dpad-arrow vgp-dpad-down">&#9660;</div>
    <div class="vgp-dpad-arrow vgp-dpad-left">&#9664;</div>
    <div class="vgp-dpad-arrow vgp-dpad-right">&#9654;</div>
  </div>
  <div class="vgp-btn vgp-anchor" id="vgp-l3">L3</div>
  <div class="vgp-btn vgp-anchor" id="vgp-r3">R3</div>
  <div class="vgp-face vgp-anchor" id="vgp-face">
    <div class="vgp-fbtn vgp-face-top" id="vgp-face-top"></div>
    <div class="vgp-fbtn vgp-face-left" id="vgp-face-left"></div>
    <div class="vgp-fbtn vgp-face-right" id="vgp-face-right"></div>
    <div class="vgp-fbtn vgp-face-bottom" id="vgp-face-bottom"></div>
  </div>
  <div class="vgp-btn vgp-shoulder vgp-anchor" id="vgp-lb">LB</div>
  <div class="vgp-btn vgp-shoulder vgp-anchor" id="vgp-lt">LT</div>
  <div class="vgp-btn vgp-shoulder vgp-anchor" id="vgp-rb">RB</div>
  <div class="vgp-btn vgp-shoulder vgp-anchor" id="vgp-rt">RT</div>
  <div class="vgp-btn vgp-anchor" id="vgp-select">Back</div>
  <div class="vgp-btn vgp-anchor" id="vgp-guide">&#8962;</div>
  <div class="vgp-btn vgp-anchor" id="vgp-start">Start</div>
</div>
<div id="padtest" class="hidden">
  <div id="padtest-box">
    <h3>Controller test</h3>
    <div id="padtest-top">
      <label>layout <select id="padtest-layout">
        <option value="xbox">Xbox</option>
        <option value="switch">Nintendo Switch</option>
        <option value="ps5">PlayStation 5</option>
      </select></label>
      <label><input id="padtest-block" type="checkbox" checked> block input while testing</label>
      <span id="padtest-source"></span>
    </div>
    <svg id="padtest-svg" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="padtest-readout"></div>
    <button id="padtest-close">Close</button>
  </div>
</div>
<div id="rebind" class="hidden">
  <div id="rebind-box">
    <h3 id="rebind-title">Rebind controls</h3>
    <div id="rebind-profile-row"></div>
    <div id="rebind-rows"></div>
    <div id="rebind-note"></div>
    <button id="rebind-close">Close</button>
  </div>
</div>
<div id="bar">
  <div id="statsRow">
    <button id="stats-toggle">stats &#9662;</button>
    <span id="st">connecting...</span>
    <span id="info"></span>
  </div>
  <div id="gpdebugRow">
    <span id="gpdebug"></span>
  </div>
  <div id="controlsRow">
    <!-- The bar is one short line, and everything else lives in a group
         that opens over the video.
         
         It was a single flat row of twenty-odd controls that wrapped onto
         four or five lines and covered the top of the picture. Grouping
         is not decoration here: the things a person reaches for during a
         session are mute, volume and logging in, and those were being
         hunted for among hue and trigger thresholds. -->
    <button id="mute">mute</button>
    <label>volume <input id="volume" type="range" min="0" max="100" value="25"><span id="vv">25%</span></label>
    <span id="auth-row" class="hidden">
      <span id="auth-state">viewer</span>
      <button id="login-btn">log in to play</button>
    </span>

    <details class="menu-group" id="group-stream"><summary>stream</summary><div class="menu-items">
      <label title="Resolution the browser stream is encoded at. The capture card keeps delivering its own size; this is the scale on the way to the encoder, so lowering it also cuts most of the encoding work. Applies live, to every browser client -- there is one encoder.">resolution <select id="resolution">
        <option value="1080">1080p60</option>
        <option value="720">720p60</option>
        <option value="480">480p60</option>
      </select></label>
      <label>quality <input id="quality" type="range" min="2" max="50" step="1" value="12"><span id="qv">12 Mbps</span></label>
      <label title="How the capture card delivers frames. YUYV is raw and costs the least CPU; MJPEG is compressed on the card and decoded here. Switchable while running so the two can be compared over long sessions -- suspected in the freezes.">capture <select id="capture-format">
        <option value="yuyv">YUYV (direct)</option>
        <option value="mjpeg">MJPEG (decoded)</option>
      </select></label>
      <label><input id="vsync" type="checkbox"> vsync</label>
      <label><input id="fullscreen-toggle" type="checkbox"> fullscreen</label>
    </div></details>

    <details class="menu-group" id="group-picture"><summary>picture</summary><div class="menu-items">
      <label>brightness <input id="vid-brightness" type="range" min="50" max="150" step="1" value="100"><span id="vid-brightness-v">100%</span></label>
      <label>contrast <input id="vid-contrast" type="range" min="50" max="150" step="1" value="100"><span id="vid-contrast-v">100%</span></label>
      <label>saturation <input id="vid-saturation" type="range" min="0" max="200" step="1" value="100"><span id="vid-saturation-v">100%</span></label>
      <label>hue <input id="vid-hue" type="range" min="-180" max="180" step="1" value="0"><span id="vid-hue-v">0&deg;</span></label>
      <button id="vid-filter-reset">reset video</button>
    </div></details>

    <details class="menu-group" id="group-input"><summary>controls</summary><div class="menu-items">
      <label>gamepad <select id="gamepad-select"><option value="-1">none detected</option></select></label>
      <label><input id="invert-ry" type="checkbox"> invert right stick up/down</label>
      <label>LT threshold <input id="lt-threshold" type="range" min="-1" max="1" step="0.05" value="0.3"><span id="ltv">0.30</span></label>
      <label>RT threshold <input id="rt-threshold" type="range" min="-1" max="1" step="0.05" value="0.3"><span id="rtv">0.30</span></label>
      <label title="Movement around the centre that counts as no movement at all. Raise it if the character drifts with your hands off the pad.">L stick deadzone <input id="lstick-deadzone" type="range" min="0" max="40" step="1" value="5"><span id="lstick-deadzone-v">5%</span></label>
      <label title="How far the stick has to go to count as fully pushed. Lower it if pushing all the way is read as a gentle push -- a worn stick no longer reaches its electrical maximum.">L stick range <input id="lstick-range" type="range" min="45" max="100" step="1" value="100"><span id="lstick-range-v">100%</span></label>
      <label title="The same, for the corners. A stick reaches less far diagonally than along an axis, and by how much differs from one stick to the next, so a single number cannot describe both. Lower it if diagonals will not reach full deflection.">L stick diagonals <input id="lstick-diagonal" type="range" min="45" max="100" step="1" value="100"><span id="lstick-diagonal-v">100%</span></label>
      <label title="Movement around the centre that counts as no movement at all. Raise it if the aim drifts with your hands off the pad.">R stick deadzone <input id="rstick-deadzone" type="range" min="0" max="40" step="1" value="5"><span id="rstick-deadzone-v">5%</span></label>
      <label title="How far the stick has to go to count as fully pushed. Lower it if pushing all the way is read as a gentle push -- a worn stick no longer reaches its electrical maximum.">R stick range <input id="rstick-range" type="range" min="45" max="100" step="1" value="100"><span id="rstick-range-v">100%</span></label>
      <label title="The same, for the corners. A stick reaches less far diagonally than along an axis, and by how much differs from one stick to the next, so a single number cannot describe both. Lower it if diagonals will not reach full deflection.">R stick diagonals <input id="rstick-diagonal" type="range" min="45" max="100" step="1" value="100"><span id="rstick-diagonal-v">100%</span></label>
      <button id="rebind-btn" class="hidden">rebind controls</button>
      <button id="padtest-btn">test controller</button>
    </div></details>

    <details class="menu-group" id="group-touch"><summary>touch pad</summary><div class="menu-items">
      <label id="vgp-layout-row" class="hidden">layout <select id="vgp-layout">
        <option value="xbox">Xbox</option>
        <option value="playstation">PlayStation</option>
        <option value="nintendo">Nintendo</option>
      </select></label>
      <label id="vgp-symmetric-row" class="hidden"><input id="vgp-symmetric" type="checkbox"> symmetric sticks</label>
      <label id="vgp-color-row" class="hidden">button color <input id="vgp-color" type="color" value="#ffffff"></label>
      <label id="vgp-opacity-row" class="hidden">button opacity <input id="vgp-opacity" type="range" min="10" max="100" step="5" value="100"><span id="vgp-opacity-v">100%</span></label>
      <label id="vgp-edit-row" class="hidden"><input id="vgp-edit-toggle" type="checkbox"> move buttons</label>
      <button id="vgp-reset" class="hidden">reset layout</button>
      <span id="vgp-hint">pick <b>Virtual buttons (touch)</b> under controls to use these.</span>
    </div></details>

    <details class="menu-group" id="group-console"><summary>console</summary><div class="menu-items">
      <button id="wake-console">wake console</button>
      <button id="reset-dongle" title="Re-enumerates the gamepad adapter: releases it, waits, and re-runs its startup handshake with the console. Same thing as unplugging and replugging it.">reset dongle</button>
      <button id="restart-server" title="Stops and starts the capture program, keeping its pid and its log. The stream drops for a few seconds and this page reloads itself once the server answers again. The one thing that has always brought the sound back when it stopped arriving.">restart server</button>
      <span id="restart-note"></span>
    </div></details>
    <!-- Always visible, unlike the stats line, which is collapsible:
         "which version am I running" should be answerable by looking at
         the page rather than by opening something first. -->
    <span id="ver" class="version"></span>
  </div>
</div>
<!-- Plain scripts in one shared scope, loaded in an order that matters:
     a function declaration hoists within a file and not across two, so
     anything called as a file loads has to be defined in a file already
     loaded. tests/run_tests.js pins this list and this order. -->
<script src="/web/main.js"></script>
<script src="/web/settings.js"></script>
<script src="/web/ui/controls.js"></script>
<script src="/web/ui/overlay.js"></script>
<script src="/web/authentication.js"></script>
<script src="/web/gamepad.js"></script>
<script src="/web/keyboard.js"></script>
<script src="/web/ui/panels.js"></script>
<script src="/web/touchpad.js"></script>
<script src="/web/webrtc.js"></script>
</body></html>
